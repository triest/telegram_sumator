# Copy this file to config.yaml and edit.

check_interval_minutes: 40
# Порог привязан к модели: Qwen3-Embedding ~0.62, старая MiniLM ~0.38.
similarity_threshold: 0.62

# Локальная модель смысла (скачивается один раз). Лучшая точность на реальных постах
# (0.85 против 0.70 у MiniLM). Для слабых устройств: paraphrase-multilingual-MiniLM-L12-v2 (порог ~0.38)
embedding_model: "Qwen/Qwen3-Embedding-0.6B"

# Where to store data (relative to project root, created automatically)
db_path: "data/digest.db"

# Device used for the local embedding model.
# "auto" (default) uses your NVIDIA GPU (CUDA) automatically if you
# installed the CUDA build of torch (see README) -- much faster on PC.
# Falls back to CPU if no GPU/CUDA is found, which is also what happens
# automatically on Android/Termux (no CUDA there).
# Force with "cuda" or "cpu" if you want to override auto-detection.
embedding_device: "auto"

interest_examples:
  - "Новые модели ИИ, релизы LLM, Claude, GPT, open-source модели"
  - "Python библиотеки, инструменты разработчика, релизы фреймворков"
  - "Стартапы, инвестиции, интересные продукты"
  - "Научные прорывы в AI и компьютерных науках"
  - "Мемы про программистов и нейросети"

global_exclude_keywords:
  - "реклама"
  - "казино"
  - "заработок без вложений"

channels:
  # leave empty = watch all, or list specific ones
  # - username: "somechannel"
  #   watch: true

# --- Speed ---
only_broadcast: true      # watch only channels, skip group chats
first_run_limit: 30       # posts per channel on the very first scan
max_concurrent: 6         # channels fetched in parallel

# --- Optional local LLM (Ollama) for topic summaries ("Сводка (ИИ)" button) ---
# Install Ollama (ollama.com), run `ollama pull qwen2.5:3b`, then set:
# llm_model: "qwen2.5:3b"
# "embedded" = маленькая модель внутри приложения (скачается один раз, ~2 ГБ)
# embedded_model: qwen2.5-1.5b-instruct-q4_k_m.gguf   # полегче, для слабых ПК
# embedded_repo: Qwen/Qwen2.5-1.5B-Instruct-GGUF
llm_model: "embedded"
llm_url: "http://localhost:11434"

# Only posts you have NOT read in Telegram yet (recommended).
only_unread: true

# --- Topics (also editable in the app: Настройки) ---
# Each topic = name + keywords/phrases; posts are grouped by best-matching topic.
# topics:
#   - name: "ИИ и нейросети"
#     keywords: ["LLM", "GPT", "Claude", "новые модели"]
#   - name: "Стартапы"
#     keywords: ["инвестиции", "раунд", "продукт"]

# Сам создавать новые темы из групп похожих постов, не подошедших ни под одну тему
# (название предлагает встроенная модель). Включается и в Настройках.
auto_topics: false
auto_topics_min_posts: 4
